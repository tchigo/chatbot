<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant AI Chatbot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #chat-container {
            max-height: 70vh;
            overflow-y: auto;
            scroll-behavior: smooth;
        }
        .chat-message {
            max-width: 80%;
            margin: 10px;
            padding: 10px;
            border-radius: 10px;
        }
        .user-message {
            background-color: #3b82f6;
            color: rgb(250, 247, 247);
            margin-left: auto;
        }
        .bot-message {
            background-color: #e5e7eb;
            color: black;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-6">
        <h1 class="text-2xl font-bold text-center mb-4">Restaurant Chatbot</h1>
        <div id="chat-container" class="mb-4 p-4 bg-gray-50 rounded-lg"></div>
        <div class="flex">
            <input type="text" id="user-input" class="flex-1 p-2 border rounded-l-lg focus:outline-none" placeholder="Type your message..." />
            <button id="send-btn" class="p-2 bg-blue-500 text-white rounded-r-lg hover:bg-blue-600">Send</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById("chat-container");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");

        function addMessage(message, isUser) {
            const messageDiv = document.createElement("div");
            messageDiv.classList.add("chat-message", isUser ? "user-message" : "bot-message");
            messageDiv.textContent = message;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            addMessage(message, true);
            userInput.value = "";

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message })
                });
                const data = await response.json();
                addMessage(data.response, false);
            } catch (error) {
                addMessage("Error: Could not connect to the server.", false);
            }
        }

        sendBtn.addEventListener("click", sendMessage);
        userInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
